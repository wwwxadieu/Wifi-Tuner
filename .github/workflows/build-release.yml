name: Build and Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Cần "contents: write" để softprops/action-gh-release tạo/cập nhật release
    # và tải asset lên — không có block này, token mặc định chỉ có quyền đọc và
    # bước upload sẽ thất bại (đã xảy ra ở lần release trước, exe build thành
    # công nhưng bước upload lỗi ngay lập tức do bị từ chối quyền).
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      # Version luôn lấy từ package.json (nguồn duy nhất) — dùng chung cho cả
      # trigger push-tag lẫn workflow_dispatch, để không cần push git tag từ
      # bên ngoài mà vẫn tạo đúng release. softprops/action-gh-release bên
      # dưới tự tạo tag này nếu chưa tồn tại.
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Electron Release Binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:dist:win

      - name: Upload Release Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WiFi Tuner ${{ steps.version.outputs.tag }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
